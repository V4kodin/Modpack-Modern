name: Deploy to Server

on:
  workflow_call:
    inputs:
      release:
        description: 'Release tag to deploy, or "latest"'
        type: string
        default: latest
      dry_run:
        description: 'Only report what would change, touch nothing'
        type: boolean
        default: false
      backup_only:
        description: 'Just take a panel backup and stop, deploy nothing'
        type: boolean
        default: false
  # also dispatchable on its own, to deploy an existing release or to take a backup
  workflow_dispatch:
    inputs:
      release:
        description: 'Тег релиза или latest'
        type: string
        default: latest
      dry_run:
        description: 'Пробный прогон: ничего не менять на сервере'
        type: boolean
        default: false
      backup_only:
        description: 'Только снять бэкап, ничего не раскатывать'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Sync release to game server
    runs-on: ubuntu-latest
    env:
      PANEL: ${{ vars.PANEL_URL }}
      SERVER_ID: ${{ vars.PANEL_SERVER_ID }}
      API_KEY: ${{ secrets.PANEL_API_KEY }}
      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT }}
      SFTP_USER: ${{ vars.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      DRY_RUN: ${{ inputs.dry_run }}
      BACKUP_ONLY: ${{ inputs.backup_only }}
      # backups are the safety net for a bad rollout, so they must stay restorable:
      # only genuinely worthless paths are skipped, including the backups another
      # mod writes itself, which would otherwise be counted twice
      BACKUP_IGNORED: |
        /logs
        /crash-reports
        /backups
        /cache
        *.log
        *.log.gz
    steps:
      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$RELEASE" = 'latest' ]; then
            tag=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')
          else
            tag="$RELEASE"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve a release to deploy" && exit 1
          fi
          echo "DEPLOY_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release: $tag"

      - name: Check backup capacity
        run: |
          # read only, so this also runs during a dry run and verifies that the API
          # key works and carries the backup permissions
          # a dry run should diagnose everything rather than stop at the first problem,
          # so panel trouble only downgrades to a warning there
          lvl=error
          if [ "$DRY_RUN" = 'true' ]; then lvl=warning; fi

          panel() {
            local out="$1" path="$2"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $API_KEY" -H 'Accept: application/json' \
              "$PANEL/api/client/servers/$SERVER_ID$path")
            case "$code" in
              200) return 0 ;;
              401) echo "::$lvl::Panel rejected the API key (401). On Pelican the full key is the"
                   echo "::$lvl::16 character identifier plus a 32 character secret, and the secret"
                   echo "::$lvl::is shown only once when the key is created. The identifier alone,"
                   echo "::$lvl::which is what the key list displays, is not enough to authenticate." ;;
              403) echo "::$lvl::The API key may not touch this server (403). Either it belongs to"
                   echo "::$lvl::another account, it lacks the backup and control permissions, or its"
                   echo "::$lvl::allowed IP list does not cover GitHub runners." ;;
              404) echo "::$lvl::No server '$SERVER_ID' at $PANEL (404)."
                   echo "::$lvl::Check the PANEL_URL and PANEL_SERVER_ID variables." ;;
              *)   echo "::$lvl::Panel returned HTTP $code for $path"
                   cat "$out" ;;
            esac
            return 1
          }

          if ! panel server.json ''; then
            if [ "$DRY_RUN" = 'true' ]; then
              echo "dry run: skipping the backup checks, continuing to verify the file sync"
              exit 0
            fi
            exit 1
          fi
          limit=$(jq -r '.attributes.feature_limits.backups // 0' server.json)
          echo "backup slots: $limit"

          # this account may be a subuser rather than the owner, and every client API
          # action is gated by its own permission, so report what the panel grants us
          # a plain // would swallow a legitimate false here
          echo "server owner: $(jq -r '.meta.is_server_owner
            | if . == null then "unreported" else tostring end' server.json)"

          # checking the whole set up front beats discovering a missing permission
          # halfway through, when the server is already stopped
          if jq -e '.meta.user_permissions' server.json > /dev/null 2>&1; then
            missing=$(jq -r '(.meta.user_permissions) as $have
              | if ($have | index("*")) or (.meta.is_server_owner == true) then []
                else ["backup.read", "backup.create", "backup.delete",
                      "control.start", "control.stop", "file.sftp"]
                     | map(. as $need | select($have | index($need) | not))
                end
              | join(" ")' server.json)
          else
            missing=''
            echo "panel reports no permission list, skipping the preflight"
          fi

          if [ -n "$missing" ]; then
            echo "::$lvl::The deploy account lacks these permissions on this server:"
            echo "::$lvl::  $missing"
            echo "::$lvl::The server owner grants them in the panel under this server's Users"
            echo "::$lvl::entry for the deploy account. Nothing was changed on the server."
            if [ "$DRY_RUN" = 'true' ]; then exit 0; fi
            exit 1
          fi

          # the stop logic below waits for this exact field, so make sure it parses
          # here rather than discovering it while the server is already going down
          panel state.json /resources || true
          current=$(jq -r '.attributes.current_state // "unreadable"' state.json)
          echo "server state: $current"
          case "$current" in
            running|offline|starting|stopping) ;;
            *) echo "::$lvl::Cannot read the server state from the panel, so the shutdown"
               echo "::$lvl::before the rollout cannot be confirmed."
               if [ "$DRY_RUN" != 'true' ]; then exit 1; fi ;;
          esac

          if [ "$limit" -le 0 ]; then
            echo "::$lvl::This server has no backup slots, so a pre-deploy backup cannot be taken."
            echo "::$lvl::Raise the backup limit in the panel, then run the deploy again."
            if [ "$DRY_RUN" = 'true' ]; then exit 0; fi
            exit 1
          fi

          if ! panel backups.json /backups; then
            if [ "$DRY_RUN" = 'true' ]; then exit 0; fi
            exit 1
          fi
          echo "existing backups:"
          jq -r '.data[].attributes
            | "  \(.created_at[:10])  \(if .is_locked then "locked  " else "unlocked" end)"
              + "  \((.bytes / 1048576) | floor) MB  \(.name)"' backups.json

          # both unlocking and deleting are gated by backup.delete, so a subuser
          # without it fails here; report that plainly instead of a bare curl code
          write() {
            local method="$1" path="$2" needs="$3" code
            code=$(curl -sS -o body.json -w '%{http_code}' -X "$method" \
              -H "Authorization: Bearer $API_KEY" -H 'Accept: application/json' \
              "$PANEL/api/client/servers/$SERVER_ID$path")
            case "$code" in
              200|202|204) return 0 ;;
              403) echo "::$lvl::The panel refused this action (403). The deploy account lacks the"
                   echo "::$lvl::'$needs' permission on this server. The server owner has to grant it"
                   echo "::$lvl::in the panel under this server's Users entry for the deploy account." ;;
              *)   echo "::$lvl::Panel returned HTTP $code for $method $path" ;;
            esac
            jq -r '.errors[]?.detail // empty' body.json 2>/dev/null || head -c 300 body.json
            return 1
          }

          drop_backup() {
            # the lock endpoint is a toggle, so locked backups are unlocked first,
            # otherwise the panel refuses to delete them
            if [ "$2" = 'true' ]; then
              write POST "/backups/$1/lock" backup.delete || return 1
            fi
            write DELETE "/backups/$1" backup.delete
          }

          # the pipeline holds exactly one slot: its previous pre-deploy backup is
          # dropped before the new one is taken, so repeated deploys never pile up
          dropped=0
          while read -r uuid locked created name; do
            [ -z "$uuid" ] && continue
            if [ "$DRY_RUN" = 'true' ]; then
              echo "dry run: would drop own backup $created $name"
              continue
            fi
            echo "dropping own previous backup: $created $name"
            drop_backup "$uuid" "$locked"
            dropped=$((dropped + 1))
          done < <(jq -r '[.data[].attributes
            | select((.name // "") | startswith("pre-deploy "))]
            | sort_by(.created_at) | .[]
            | "\(.uuid) \(.is_locked) \(.created_at[:10]) \(.name)"' backups.json)

          if [ "$dropped" -gt 0 ]; then
            panel backups.json /backups || true
          fi

          # the panel counts running and successful backups against the limit,
          # failed ones stop occupying a slot only once they are deleted
          used=$(jq '[.data[].attributes
            | select(.completed_at == null or .is_successful == true)] | length' backups.json)
          echo "backup slots: $used of $limit in use"

          if [ "$used" -lt "$limit" ]; then
            exit 0
          fi

          # still full, so fall back to the oldest backup that is not locked:
          # locking is how the panel marks a backup as keep-forever
          victim=$(jq -r '[.data[].attributes | select(.is_locked == false)]
            | sort_by(.created_at) | .[0] | "\(.uuid // "") \(.created_at[:10]) \(.name)"' backups.json)
          victim_uuid=${victim%% *}

          if [ -z "$victim_uuid" ] || [ "$victim_uuid" = 'null' ]; then
            echo "::$lvl::All $limit backup slots are full and every backup is locked, so there is"
            echo "::$lvl::nothing to recycle. Unlock or delete one in the panel, keeping in mind"
            echo "::$lvl::that locked backups are the ones this pipeline will never remove."
            if [ "$DRY_RUN" = 'true' ]; then exit 0; fi
            exit 1
          fi

          if [ "$DRY_RUN" = 'true' ]; then
            echo "dry run: would recycle the oldest unlocked backup ${victim#* }"
            exit 0
          fi

          echo "recycling the oldest unlocked backup: ${victim#* }"
          if ! drop_backup "$victim_uuid" false; then
            echo "::$lvl::No slot could be freed, so no pre-deploy backup can be taken and the"
            echo "::$lvl::rollout is stopped before anything on the server was touched."
            exit 1
          fi

      - name: Install lftp
        if: ${{ !inputs.backup_only }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Download release assets
        if: ${{ !inputs.backup_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p assets
          gh release download "$DEPLOY_TAG" --repo "$REPO" --dir assets \
            --pattern '*serverpack.zip' --pattern '*clientextra.zip'
          ls -lh assets/

      - name: Unpack and prune protected files
        if: ${{ !inputs.backup_only }}
        run: |
          mkdir -p deploy deploy-client
          unzip -q assets/*serverpack.zip -d deploy
          unzip -q assets/*clientextra.zip -d deploy-client

          # the serverpack may or may not wrap its contents in a folder
          root=$(dirname "$(find deploy -maxdepth 3 -type d -name mods | head -n1)")
          if [ -z "$root" ] || [ "$root" = '.' ]; then
            echo "::error::Could not locate the mods folder inside the serverpack" && exit 1
          fi
          echo "SERVER_ROOT=$root" >> "$GITHUB_ENV"
          echo "serverpack root: $root"

          # the loader itself is installed by the panel, not by us, so surface the
          # version the pack expects before the file gets pruned below
          if [ -f "$root/forge-auto-install.txt" ]; then
            loader=$(sed -n 's/^loaderVersion=//p' "$root/forge-auto-install.txt")
            mc=$(sed -n 's/^minecraftVersion=//p' "$root/forge-auto-install.txt")
            echo "PACK_LOADER=$loader" >> "$GITHUB_ENV"
            echo "PACK_MC=$mc" >> "$GITHUB_ENV"
            echo "pack expects Minecraft $mc with Forge $loader"
          fi

          # never overwrite panel-managed files or live server state
          rm -rf \
            "$root/server.properties" \
            "$root/eula.txt" \
            "$root/start_server.sh" \
            "$root/start_server.bat" \
            "$root/forge-auto-install.txt" \
            "$root/server_starter.conf" \
            "$root/DiscordIntegration-Data" \
            "$root/config/Discord-Integration.toml"

          du -sh "$root" deploy-client

      - name: Stop server
        if: ${{ !inputs.dry_run && !inputs.backup_only }}
        run: |
          send_signal() {
            local code needs
            # the panel folds kill into the stop permission
            needs="control.$1"
            [ "$1" = 'kill' ] && needs='control.stop'
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $API_KEY" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -d "{\"signal\":\"$1\"}" \
              "$PANEL/api/client/servers/$SERVER_ID/power")
            case "$code" in
              200|202|204) return 0 ;;
              403) echo "::error::The panel refused to $1 the server (403). The deploy account needs"
                   echo "::error::the '$needs' permission, granted by the server owner." ;;
              *)   echo "::error::Panel returned HTTP $code for the $1 signal" ;;
            esac
            jq -r '.errors[]?.detail // empty' body.json 2>/dev/null || head -c 300 body.json
            return 1
          }
          state() {
            curl -sS -H "Authorization: Bearer $API_KEY" -H 'Accept: application/json' \
              "$PANEL/api/client/servers/$SERVER_ID/resources" | jq -r '.attributes.current_state'
          }

          echo "current state: $(state)"
          send_signal stop

          for i in $(seq 1 24); do
            sleep 5
            s=$(state)
            echo "  [$i] $s"
            if [ "$s" = 'offline' ]; then
              echo "server is offline"
              exit 0
            fi
          done

          echo "::warning::Server did not stop within 120s, sending kill"
          send_signal kill
          sleep 10
          if [ "$(state)" != 'offline' ]; then
            echo "::error::Server is still not offline, aborting before touching files" && exit 1
          fi

      - name: Back up the server
        if: ${{ !inputs.dry_run }}
        run: |
          # runs after the shutdown, so the archive holds a quiet world with no
          # half-written region files, and it is a hard gate: no backup, no rollout
          # locked, so neither the panel's backup schedule nor a stray click can drop
          # the safety net; the next deploy unlocks it again before replacing it
          body=$(jq -n --arg name "pre-deploy $DEPLOY_TAG" --arg ignored "$BACKUP_IGNORED" \
            '{name: $name, ignored: $ignored, is_locked: true}')

          created=$(curl -sS -X POST \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d "$body" \
            "$PANEL/api/client/servers/$SERVER_ID/backups")

          uuid=$(echo "$created" | jq -r '.attributes.uuid // empty')
          if [ -z "$uuid" ]; then
            echo "::error::Panel refused to start a backup. If the reason below is a permission"
            echo "::error::problem, the deploy account needs 'backup.create' on this server."
            echo "$created" | jq . || echo "$created"
            exit 1
          fi
          echo "backup $uuid started, waiting for it to finish"

          # a full modpack server takes a while to archive, so allow 30 minutes
          for i in $(seq 1 180); do
            sleep 10
            info=$(curl -sS -H "Authorization: Bearer $API_KEY" -H 'Accept: application/json' \
              "$PANEL/api/client/servers/$SERVER_ID/backups/$uuid")
            finished=$(echo "$info" | jq -r '.attributes.completed_at // empty')

            if [ -z "$finished" ]; then
              if [ $((i % 6)) -eq 0 ]; then echo "  still running (${i}0s)"; fi
              continue
            fi

            if [ "$(echo "$info" | jq -r '.attributes.is_successful')" != 'true' ]; then
              echo "::error::Backup $uuid finished but failed, not deploying"
              exit 1
            fi

            size=$(echo "$info" | jq -r '(.attributes.bytes / 1048576) | floor')
            echo "backup finished: ${size} MB"
            echo "BACKUP_INFO=${uuid} (${size} MB)" >> "$GITHUB_ENV"
            exit 0
          done

          echo "::error::Backup did not finish within 30 minutes, not deploying"
          exit 1

      - name: Sync files over SFTP
        if: ${{ !inputs.backup_only }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            mode='--dry-run'
            echo "dry run: nothing will be written"
          else
            mode=''
          fi

          # host-modpack may not exist yet; failures here are not fatal
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<'PREP' || true
          set sftp:auto-confirm yes
          mkdir -p /automodpack/host-modpack/main
          bye
          PREP

          # --ignore-time makes lftp compare by size alone: a CI checkout gives every
          # file a fresh mtime, so the default size-and-time comparison would re-upload
          # the whole mods folder on every deploy
          #
          # --delete where the repo is the only writer, omitted for config/defaultconfigs
          # because mods create their own runtime files in there
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<PACK
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set mirror:parallel-transfer-count 4
          mirror -R $mode --delete --ignore-time --no-perms "$SERVER_ROOT/mods"           /mods
          mirror -R $mode --delete --ignore-time --no-perms "$SERVER_ROOT/kubejs"         /kubejs
          mirror -R $mode --delete --ignore-time --no-perms "$SERVER_ROOT/tacz"           /tacz
          mirror -R $mode          --ignore-time --no-perms "$SERVER_ROOT/config"         /config
          mirror -R $mode          --ignore-time --no-perms "$SERVER_ROOT/defaultconfigs" /defaultconfigs
          mirror -R $mode --delete --ignore-time --no-perms ./deploy-client                /automodpack/host-modpack/main
          bye
          PACK

          # the AutoModpack config is small and version controlled, so always overwrite it
          # rather than relying on a size comparison
          if [ "$DRY_RUN" != 'true' ]; then
            lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<AMP
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          put -O /automodpack "$SERVER_ROOT/automodpack/automodpack-server.json"
          bye
          AMP
          fi

      - name: Start server
        if: ${{ !inputs.dry_run && !inputs.backup_only }}
        run: |
          # the files are already in place, so a refused start leaves the server down
          # and that has to be loud rather than a bare curl exit code
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{"signal":"start"}' \
            "$PANEL/api/client/servers/$SERVER_ID/power")
          case "$code" in
            200|202|204) echo "start signal sent" ;;
            403) echo "::error::The panel refused to start the server (403). The deploy account needs"
                 echo "::error::the 'control.start' permission. The update is already on disk, so"
                 echo "::error::starting the server by hand in the panel completes the rollout."
                 jq -r '.errors[]?.detail // empty' body.json 2>/dev/null
                 exit 1 ;;
            *)   echo "::error::Panel returned HTTP $code for the start signal"
                 head -c 300 body.json
                 exit 1 ;;
          esac

      - name: Summary
        if: always()
        run: |
          {
            if [ -n "$BACKUP_INFO" ]; then
              echo "Бэкап перед раскаткой снят и залочен: \`$BACKUP_INFO\`."
              echo "Он держит один слот и будет заменён следующей раскаткой."
              echo ""
            fi

            if [ "$BACKUP_ONLY" = 'true' ]; then
              echo "Режим «только бэкап»: на сервер ничего не заливалось."
            elif [ "$DRY_RUN" = 'true' ]; then
              echo "Пробный прогон релиза \`$DEPLOY_TAG\`: бэкап не снимался, на сервер ничего не заливалось."
            else
              echo "Релиз \`$DEPLOY_TAG\` выложен на сервер, сервер перезапущен."
              echo ""
              echo "AutoModpack пересоберёт метаданные на старте, клиенты получат обновление при следующем заходе."
              echo ""
              echo "Пак собран под Minecraft \`$PACK_MC\` и Forge \`$PACK_LOADER\`."
              echo "Загрузчик ставит панель, а не этот пайплайн: если версия Forge изменилась, обнови её в панели вручную."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
