name: Build Release

on:
  workflow_call:
    inputs:
      publish_client:
        description: 'Attach the client assets and publish as a full release'
        type: boolean
        default: true
    outputs:
      version:
        description: 'Version tag of the created release'
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: write

env:
  # fixed asset names, so releases/latest/download/<name> stays a permanent link
  MRPACK_NAME: TerraFirmaGreg-oljk.mrpack
  SERVERPACK_NAME: TerraFirmaGreg-oljk-serverpack.zip
  CLIENTEXTRA_NAME: TerraFirmaGreg-oljk-clientextra.zip

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          # --exclude '*-*' keeps our own tags (0.13.10-oljk.N) out of the lookup,
          # upstream tags are plain semver without a dash
          base=$(git describe --tags --abbrev=0 --match '[0-9]*' --exclude '*-*' 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "::error::No upstream release tag reachable from HEAD" && exit 1
          fi
          version="${base}-oljk.${{ github.run_number }}"

          mc=$(jq -r '.mc_versions[0]' pakku-lock.json)
          loader_type=$(jq -r '.loaders | keys[0]' pakku-lock.json)
          loader_version=$(jq -r '.loaders | to_entries[0].value' pakku-lock.json)

          {
            echo "version=$version"
            echo "base=$base"
            echo "mc=$mc"
            echo "loader_type=$loader_type"
            echo "loader_version=$loader_version"
          } >> "$GITHUB_OUTPUT"

          echo "Building $version (upstream $base, $loader_type-$loader_version, MC $mc)"

      - name: Substitute placeholders
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC: ${{ steps.ver.outputs.mc }}
          LOADER_TYPE: ${{ steps.ver.outputs.loader_type }}
          LOADER_VERSION: ${{ steps.ver.outputs.loader_version }}
        run: |
          # pakku.json no longer carries the DEV placeholder, so set it through jq
          jq --arg v "$VERSION" '.version = $v' pakku.json > pakku.json.tmp
          mv pakku.json.tmp pakku.json

          for f in config/mod-director/modpack.json \
                   .pakku/multimc-overrides/instance.cfg \
                   .pakku/server-overrides/server.properties \
                   .pakku/docker-overrides/docker-compose.yml; do
            sed -i "s/DEV/${VERSION}/g" "$f"
          done
          find config/fancymenu/customization -maxdepth 1 -type f \
            -exec sed -i "s/DEV/${VERSION}/g" {} +

          for f in .pakku/multimc-overrides/mmc-pack.json \
                   .pakku/server-overrides/forge-auto-install.txt \
                   .pakku/docker-overrides/docker-compose.yml; do
            sed -i "s/LOADER_VERSION/${LOADER_VERSION}/g;s/LOADER_TYPE/${LOADER_TYPE}/g;s/MINECRAFT_VERSION/${MC}/g" "$f"
          done

          # Minecraft only accepts a 64x64 server-icon.png and rejects anything else,
          # upstream ships the 32x32 icon here, which is why the icon never worked
          cp -f config/fancymenu/assets/icons/icon64x64.png .pakku/server-overrides/server-icon.png

      - name: Cache pakku downloads
        uses: actions/cache@v6
        with:
          path: build/.cache
          key: pakku-cache-${{ hashFiles('pakku-lock.json') }}
          restore-keys: pakku-cache-

      - name: Fetch and export with pakku
        run: |
          java -jar pakku.jar fetch
          java -jar pakku.jar export

      - name: Drop projects marked export false
        run: |
          # upstream's filter in build.yml looks under the root of pakku.json instead
          # of .projects, and matches jar names by slug prefix, which does not hold for
          # every mod, so resolve the real file names through the lock instead
          jq -r --slurpfile cfg pakku.json '
            [$cfg[0].projects | to_entries[] | select(.value.export == false) | .key] as $bad
            | .projects[]
            | select([(.slug // {}) | .[]] | any(IN($bad[])))
            | .files[].file_name
          ' pakku-lock.json | sort -u > noexport.txt

          while IFS= read -r jar; do
            if [ -n "$jar" ] && [ -f "mods/$jar" ]; then rm -v "mods/$jar"; fi
          done < noexport.txt

      - name: Collect artifacts
        run: |
          mkdir -p out work/clientextra/mods work/cfpack

          cp build/serverpack/*.zip "out/${SERVERPACK_NAME}"
          cp build/modrinth/*.mrpack "out/${MRPACK_NAME}"

          # clientextra becomes AutoModpack's host-modpack, so it has to hold the
          # complete client-side file set: AutoModpack cannot detect mod sides on
          # Forge, so we go by pakku's own side data instead of letting it guess
          {
            jq -r '.projects[] | select(.side == "SERVER") | .files[].file_name' pakku-lock.json
            # AutoModpack updates its own jar outside the modpack
            jq -r '.projects[] | select(.slug.modrinth == "automodpack") | .files[].file_name' pakku-lock.json
          } | sort -u > work/excluded-mods.txt

          find ./mods -maxdepth 1 -name '*.jar' -printf '%f\n' | sort > work/all-mods.txt
          comm -23 work/all-mods.txt work/excluded-mods.txt > work/client-mods.txt
          echo "mods: $(wc -l < work/all-mods.txt) fetched, $(wc -l < work/client-mods.txt) for clients"

          while IFS= read -r jar; do
            [ -n "$jar" ] && cp "mods/$jar" work/clientextra/mods/
          done < work/client-mods.txt

          # resource packs and shaders are pakku projects rather than overrides, so
          # they are not part of the exported overrides and come from the fetch output
          for dir in resourcepacks shaderpacks; do
            if [ -d "$dir" ]; then cp -r "$dir" work/clientextra/; fi
          done

          # client flavour of config/defaultconfigs/kubejs/tacz, as pakku merged it
          unzip -q build/curseforge/*.zip -d work/cfpack
          if [ ! -d work/cfpack/overrides ]; then
            echo "::error::CurseForge export contains no overrides folder" && exit 1
          fi
          cp -r work/cfpack/overrides/. work/clientextra/

          ( cd work/clientextra && zip -qr "../../out/${CLIENTEXTRA_NAME}" . )
          ls -lh out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          {
            echo "Сборка форка на базе апстрим-релиза **$BASE**."
            echo ""
            echo "## Клиентам"
            echo ""
            echo "Постоянная ссылка на последнюю версию, вставить в Prism Launcher через Add Instance -> Import:"
            echo ""
            echo "\`https://github.com/$REPO/releases/latest/download/${MRPACK_NAME}\`"
            echo ""
            echo "Дальше обновления приходят сами через AutoModpack при заходе на сервер."
          } > notes.md

          args=(--repo "$REPO" --title "$VERSION" --notes-file notes.md --target "$GITHUB_SHA")
          if [ '${{ inputs.publish_client }}' = 'true' ]; then
            # full release: the permanent client link resolves to this one
            gh release create "$VERSION" "${args[@]}" \
              "out/${SERVERPACK_NAME}" "out/${MRPACK_NAME}" "out/${CLIENTEXTRA_NAME}"
          else
            # server-only: marked prerelease so releases/latest keeps pointing at the
            # last release that actually carries the client assets
            gh release create "$VERSION" "${args[@]}" --prerelease \
              "out/${SERVERPACK_NAME}" "out/${CLIENTEXTRA_NAME}"
          fi

      - name: Summary
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "Релиз [\`$VERSION\`](https://github.com/$REPO/releases/tag/$VERSION) собран."
            if [ '${{ inputs.publish_client }}' = 'true' ]; then
              echo ""
              echo "Ссылка для клиентов: \`https://github.com/$REPO/releases/latest/download/${MRPACK_NAME}\`"
            else
              echo ""
              echo "Помечен как prerelease, клиентский \`.mrpack\` не публиковался."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
