name: Build Release

on:
  workflow_call:
    inputs:
      publish_client:
        description: 'Attach the client assets and publish as a full release'
        type: boolean
        default: true
    outputs:
      version:
        description: 'Version tag of the created release'
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: write

env:
  # fixed asset names, so releases/latest/download/<name> stays a permanent link
  CLIENTPACK_NAME: TerraFirmaGreg-oljk-curseforge.zip
  SERVERPACK_NAME: TerraFirmaGreg-oljk-serverpack.zip
  CLIENTEXTRA_NAME: TerraFirmaGreg-oljk-clientextra.zip

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          # --exclude '*-*' keeps our own tags (0.13.10-oljk.N) out of the lookup,
          # upstream tags are plain semver without a dash
          base=$(git describe --tags --abbrev=0 --match '[0-9]*' --exclude '*-*' 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "::error::No upstream release tag reachable from HEAD" && exit 1
          fi
          version="${base}-oljk.${{ github.run_number }}"

          mc=$(jq -r '.mc_versions[0]' pakku-lock.json)
          loader_type=$(jq -r '.loaders | keys[0]' pakku-lock.json)
          loader_version=$(jq -r '.loaders | to_entries[0].value' pakku-lock.json)

          {
            echo "version=$version"
            echo "base=$base"
            echo "mc=$mc"
            echo "loader_type=$loader_type"
            echo "loader_version=$loader_version"
          } >> "$GITHUB_OUTPUT"

          echo "Building $version (upstream $base, $loader_type-$loader_version, MC $mc)"

      - name: Substitute placeholders
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC: ${{ steps.ver.outputs.mc }}
          LOADER_TYPE: ${{ steps.ver.outputs.loader_type }}
          LOADER_VERSION: ${{ steps.ver.outputs.loader_version }}
        run: |
          # pakku.json no longer carries the DEV placeholder, so set it through jq
          jq --arg v "$VERSION" '.version = $v' pakku.json > pakku.json.tmp
          mv pakku.json.tmp pakku.json

          for f in config/mod-director/modpack.json \
                   .pakku/multimc-overrides/instance.cfg \
                   .pakku/server-overrides/server.properties \
                   .pakku/docker-overrides/docker-compose.yml; do
            sed -i "s/DEV/${VERSION}/g" "$f"
          done
          find config/fancymenu/customization -maxdepth 1 -type f \
            -exec sed -i "s/DEV/${VERSION}/g" {} +

          for f in .pakku/multimc-overrides/mmc-pack.json \
                   .pakku/server-overrides/forge-auto-install.txt \
                   .pakku/docker-overrides/docker-compose.yml; do
            sed -i "s/LOADER_VERSION/${LOADER_VERSION}/g;s/LOADER_TYPE/${LOADER_TYPE}/g;s/MINECRAFT_VERSION/${MC}/g" "$f"
          done

          # Minecraft only accepts a 64x64 server-icon.png and rejects anything else,
          # upstream ships the 32x32 icon here, which is why the icon never worked
          cp -f config/fancymenu/assets/icons/icon64x64.png .pakku/server-overrides/server-icon.png

      - name: Cache pakku downloads
        uses: actions/cache@v6
        with:
          path: build/.cache
          key: pakku-cache-${{ hashFiles('pakku-lock.json') }}
          restore-keys: pakku-cache-

      - name: Fetch and export with pakku
        run: |
          java -jar pakku.jar fetch
          java -jar pakku.jar export

      - name: Drop projects marked export false
        run: |
          # upstream's filter in build.yml looks under the root of pakku.json instead
          # of .projects, and matches jar names by slug prefix, which does not hold for
          # every mod, so resolve the real file names through the lock instead
          jq -r --slurpfile cfg pakku.json '
            [$cfg[0].projects | to_entries[] | select(.value.export == false) | .key] as $bad
            | .projects[]
            | select([(.slug // {}) | .[]] | any(IN($bad[])))
            | .files[].file_name
          ' pakku-lock.json | sort -u > noexport.txt

          while IFS= read -r jar; do
            if [ -n "$jar" ] && [ -f "mods/$jar" ]; then rm -v "mods/$jar"; fi
          done < noexport.txt

      - name: Collect artifacts
        run: |
          mkdir -p out work/clientextra/mods work/cfpack

          cp build/serverpack/*.zip "out/${SERVERPACK_NAME}"
          cp build/curseforge/*.zip "out/${CLIENTPACK_NAME}"

          # clientextra becomes AutoModpack's host-modpack, so it has to hold the
          # complete client-side file set: AutoModpack cannot detect mod sides on
          # Forge, so we go by pakku's own side data instead of letting it guess
          # A project marked SERVER can still be a mandatory library for a BOTH or
          # CLIENT project (SmartBrainLib is required by Fowl Play), so retain the
          # transitive dependency closure instead of blindly dropping every SERVER.
          python3 <<'PY'
          import json
          from pathlib import Path

          projects = json.loads(Path("pakku-lock.json").read_text())["projects"]
          by_project_id = {}
          for index, project in enumerate(projects):
              by_project_id[project["pakku_id"]] = index
              for project_id in project.get("id", {}).values():
                  by_project_id[str(project_id)] = index

          included = {
              index
              for index, project in enumerate(projects)
              if project.get("side") != "SERVER"
          }
          pending = list(included)
          while pending:
              project = projects[pending.pop()]
              dependencies = {
                  str(dependency)
                  for file in project["files"]
                  for dependency in file.get("required_dependencies", [])
              }
              for dependency in dependencies:
                  index = by_project_id.get(dependency)
                  if index is not None and index not in included:
                      included.add(index)
                      pending.append(index)

          excluded = {
              file["file_name"]
              for index, project in enumerate(projects)
              if project.get("side") == "SERVER" and index not in included
              for file in project["files"]
          }
          # AutoModpack updates its own jar outside the managed modpack.
          excluded.update(
              file["file_name"]
              for project in projects
              if project.get("slug", {}).get("modrinth") == "automodpack"
              for file in project["files"]
          )

          Path("work/excluded-mods.txt").write_text(
              "".join(f"{name}\n" for name in sorted(excluded))
          )
          retained = [
              next(iter(project["name"].values()))
              for index, project in enumerate(projects)
              if project.get("side") == "SERVER" and index in included
          ]
          print("Server-marked client dependencies retained:", retained)
          PY

          find ./mods -maxdepth 1 -name '*.jar' -printf '%f\n' | sort > work/all-mods.txt
          comm -23 work/all-mods.txt work/excluded-mods.txt > work/client-mods.txt
          echo "mods: $(wc -l < work/all-mods.txt) fetched, $(wc -l < work/client-mods.txt) for clients"

          while IFS= read -r jar; do
            [ -n "$jar" ] && cp "mods/$jar" work/clientextra/mods/
          done < work/client-mods.txt

          # resource packs and shaders are pakku projects rather than overrides, so
          # they are not part of the exported overrides and come from the fetch output
          for dir in resourcepacks shaderpacks; do
            if [ -d "$dir" ]; then cp -r "$dir" work/clientextra/; fi
          done

          # client flavour of config/defaultconfigs/kubejs/tacz, as pakku merged it
          unzip -q "out/${CLIENTPACK_NAME}" -d work/cfpack
          if [ ! -d work/cfpack/overrides ]; then
            echo "::error::CurseForge export contains no overrides folder" && exit 1
          fi

          # Pakku can choose different versions for the same project on CurseForge
          # and Modrinth. Normalize the CurseForge installer to the exact jars fetched
          # for the server: retain exact CurseForge references (including restricted
          # projects), replace stale references with redistributable fetched jars,
          # and remove server-only projects. AutoModpack itself is added as bootstrap.
          python3 <<'PY'
          import json
          import shutil
          from pathlib import Path

          lock = json.loads(Path("pakku-lock.json").read_text())
          manifest_file = Path("work/cfpack/manifest.json")
          manifest = json.loads(manifest_file.read_text())
          known_hosts_file = Path(
              "work/cfpack/overrides/automodpack/.private/automodpack-known-hosts.json"
          )
          if not known_hosts_file.is_file():
              print("::error::CurseForge installer is missing the pinned AutoModpack certificate")
              raise SystemExit(1)

          expected = set(Path("work/client-mods.txt").read_text().splitlines())
          expected.update(
              file["file_name"]
              for project in lock["projects"]
              if project.get("slug", {}).get("modrinth") == "automodpack"
              for file in project["files"]
          )

          by_cf_file_id = {}
          project_by_filename = {}
          for project in lock["projects"]:
              for file in project["files"]:
                  project_by_filename[file["file_name"]] = project
                  if file["type"] == "curseforge":
                      by_cf_file_id[str(file["id"])] = (file["file_name"], project)

          provided = set()
          unresolved = []
          normalized_manifest_files = []
          for manifest_entry in manifest["files"]:
              file_id = str(manifest_entry["fileID"])
              if file_id not in by_cf_file_id:
                  unresolved.append(file_id)
                  normalized_manifest_files.append(manifest_entry)
                  continue

              file_name, project = by_cf_file_id[file_id]
              if project["type"] != "MOD":
                  normalized_manifest_files.append(manifest_entry)
              elif file_name in expected:
                  normalized_manifest_files.append(manifest_entry)
                  provided.add(file_name)
              else:
                  print(f"Dropping non-client or stale CurseForge file: {file_name}")

          if unresolved:
              print("::error::Could not resolve CurseForge file IDs:", *unresolved, sep="\n  ")
              raise SystemExit(1)

          manifest["files"] = normalized_manifest_files
          manifest_file.write_text(json.dumps(manifest, indent=2) + "\n")

          override_mods = Path("work/cfpack/overrides/mods")
          override_mods.mkdir(parents=True, exist_ok=True)
          for path in Path("work/cfpack").rglob("*.jar"):
              if path.name in expected:
                  provided.add(path.name)
              else:
                  print(f"Dropping non-client or stale embedded jar: {path.name}")
                  path.unlink()

          missing = sorted(expected - provided, key=str.casefold)
          restricted = [
              name
              for name in missing
              if project_by_filename[name].get("redistributable") is False
          ]
          if restricted:
              print("::error::Restricted client mods are absent from the CurseForge manifest:")
              print(*restricted, sep="\n  ")
              raise SystemExit(1)

          for name in missing:
              source = Path("mods") / name
              if not source.is_file():
                  print(f"::error::Fetched client jar is missing: {name}")
                  raise SystemExit(1)
              print(f"Embedding cross-platform client version: {name}")
              shutil.copy2(source, override_mods / name)
              provided.add(name)

          if provided != expected:
              print("::error::Normalized installer and AutoModpack file sets still differ")
              raise SystemExit(1)

          print(f"Client installer parity verified: {len(expected)} mod jars")
          PY

          rm "out/${CLIENTPACK_NAME}"
          ( cd work/cfpack && zip -qr "../../out/${CLIENTPACK_NAME}" . )
          cp -r work/cfpack/overrides/. work/clientextra/
          ( cd work/clientextra && zip -qr "../../out/${CLIENTEXTRA_NAME}" . )
          ls -lh out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          {
            echo "Сборка форка на базе апстрим-релиза **$BASE**."
            echo ""
            echo "## Клиентам"
            echo ""
            echo "Постоянная ссылка на последнюю версию, вставить в Prism Launcher через Add Instance -> Import:"
            echo ""
            echo "\`https://github.com/$REPO/releases/latest/download/${CLIENTPACK_NAME}\`"
            echo ""
            echo "Дальше обновления приходят сами через AutoModpack при заходе на сервер."
          } > notes.md

          args=(--repo "$REPO" --title "$VERSION" --notes-file notes.md --target "$GITHUB_SHA")
          if [ '${{ inputs.publish_client }}' = 'true' ]; then
            # full release: the permanent client link resolves to this one
            gh release create "$VERSION" "${args[@]}" \
              "out/${SERVERPACK_NAME}" "out/${CLIENTPACK_NAME}" "out/${CLIENTEXTRA_NAME}"
          else
            # server-only: marked prerelease so releases/latest keeps pointing at the
            # last release that actually carries the client assets
            gh release create "$VERSION" "${args[@]}" --prerelease \
              "out/${SERVERPACK_NAME}" "out/${CLIENTEXTRA_NAME}"
          fi

      - name: Summary
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "Релиз [\`$VERSION\`](https://github.com/$REPO/releases/tag/$VERSION) собран."
            if [ '${{ inputs.publish_client }}' = 'true' ]; then
              echo ""
              echo "Ссылка для клиентов: \`https://github.com/$REPO/releases/latest/download/${CLIENTPACK_NAME}\`"
            else
              echo ""
              echo "Помечен как prerelease, клиентский CurseForge ZIP не публиковался."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
